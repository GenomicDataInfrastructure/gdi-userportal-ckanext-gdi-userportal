# The contact point of a dataset is a vcard:Kind with at most one email and one contact page.

dataset_fields:
  - field_name: contact
    label: Contact points
    repeating_label: Contact point
    repeating_subfields:
      - field_name: uri
        label: URI

      - field_name: name
        label: Name

      - field_name: name_translated
        label: Name (translations)
        help_text: Name of the contact point in each language.

      - field_name: email
        label: Email
        display_snippet: email.html
        help_text: Email of the contact point (vcard:hasEmail).

      - field_name: url
        label: Contact page
        display_snippet: link.html
        help_text: Contact page of the contact point (vcard:hasURL), one at most.
    help_text: Contact information for enquiries about the dataset.
