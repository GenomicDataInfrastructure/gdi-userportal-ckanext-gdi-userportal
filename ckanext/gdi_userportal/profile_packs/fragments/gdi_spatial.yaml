dataset_fields:
  - field_name: spatial_coverage
    solr: {flatten: [uri]}
    label: Spatial coverage
    repeating_subfields:
      - field_name: uri
        translate: true
        label: URI

      - field_name: text
        label: Label

      - field_name: geom
        label: Geometry

      - field_name: bbox
        label: Bounding Box

      - field_name: centroid
        label: Centroid
    help_text: A geographic region that is covered by the dataset.
