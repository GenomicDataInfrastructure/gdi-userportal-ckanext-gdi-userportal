dataset_fields:
  - field_name: qualified_relation
    label: Qualified relation
    repeating_label: Relationship
    repeating_subfields:
      - field_name: uri
        label: URI

      - field_name: relation
        label: Relation
        help_text: The resource related to the source resource.

      - field_name: role
        label: Role
        help_text: The function of an entity or agent with respect to another entity or resource.
    help_text: A description of a relationship with another resource.

  - field_name: was_generated_by
    label: Was generated by
    repeating_label: Was generated by
    repeating_once: true
    repeating_subfields:
      - field_name: uri
        label: Activity URI
        help_text: URI of the activity that generated this resource (prov:wasGeneratedBy) (if available).

      - field_name: label
        label: Label
        help_text: Human-readable label for the activity.

      - field_name: type
        label: Activity type
        help_text: Type of the activity.

      - field_name: seeAlso
        label: See also
        help_text: Related link for the activity.

      - field_name: dct_type
        label: Type
        help_text: Type of the activity (URI).

      - field_name: startedAtTime
        label: Started at time
        preset: datetime_flex
        help_text: When the activity started (ISO 8601).

      - field_name: wasAssociatedWith
        label: Associated agent
        repeating_label: Agent
        repeating_once: true
        repeating_subfields:
          - field_name: uri
            label: URI

          - field_name: name
            label: Name

          - field_name: email
            label: Email
            display_snippet: email.html

          - field_name: url
            label: URL
            display_snippet: link.html

          - field_name: homepage
            label: Homepage
            display_snippet: link.html

          - field_name: type
            label: Type

          - field_name: identifier
            label: Identifier

          - field_name: actedOnBehalfOf
            label: Acted on behalf of
            repeating_label: Organization
            repeating_once: true
            repeating_subfields:
              - field_name: uri
                label: URI

              - field_name: name
                label: Name

              - field_name: email
                label: Email
                display_snippet: email.html

              - field_name: url
                label: URL
                display_snippet: link.html

              - field_name: type
                label: Type

              - field_name: identifier
                label: Identifier
    help_text: Structured wasGeneratedBy activity information, including agents and organizations.

  - field_name: qualified_attribution
    label: Qualified attribution
    repeating_label: Attribution
    repeating_subfields:
      - field_name: agent
        label: Agent
        repeating_label: Agent
        repeating_once: true
        repeating_subfields: !snippet agent_subfields

      - field_name: role
        label: Role
        help_text: Role of the agent (e.g., data processor, contributor).
    help_text: Structured qualified attribution information including agent and role.

  - field_name: quality_annotation
    label: Quality annotations
    repeating_label: Quality annotation
    repeating_subfields:
      - field_name: body
        label: Body
        help_text: Content of the quality annotation (e.g., URL to certificate, measurement value, assessment result).

      - field_name: target
        label: Target
        help_text: Aspect of the dataset being annotated (e.g., URI or description of what is being assessed).

      - field_name: motivated_by
        label: Motivated by
        help_text: Motivation or reason for the quality annotation.
    help_text: Quality annotations following DQV and Web Annotation standards.

  # Note: if not provided, this will be autogenerated
  - field_name: uri
    label: URI
    help_text: An URI for this dataset (if not provided it will be autogenerated).


resource_fields:
  # Note: if not provided, this will be autogenerated
  - field_name: uri
    label: URI
    help_text: An URI for this resource (if not provided it will be autogenerated).
