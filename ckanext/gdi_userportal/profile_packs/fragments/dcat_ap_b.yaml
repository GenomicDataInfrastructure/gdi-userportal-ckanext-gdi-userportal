dataset_fields:
  # Note: CKAN will generate a unique identifier for each dataset
  - field_name: identifier
    label: Identifier
    help_text: A unique identifier of the dataset.

  - field_name: frequency
    translate: true
    label: Frequency
    help_text: The frequency at which dataset is published.
    filter_help_text:
      en: Use this filter to search datasets by publication frequency.
      nl: Gebruik deze filter om datasets op publicatiefrequentie te zoeken.
    facet_key: frequency

  - field_name: provenance
    label: Provenance
    preset: fluent_markdown
    help_text: A statement about the lineage of the dataset.

  - field_name: dcat_type
    translate: true
    label: Type
    help_text: The type of the dataset.
    # TODO: controlled vocabulary?

  - field_name: temporal_coverage
    label: Temporal coverage
    repeating_subfields:
      - field_name: start
        label: Start
        preset: datetime_flex

      - field_name: end
        label: End
        preset: datetime_flex
    help_text: The temporal period or periods the dataset covers.
    filter_help_text:
      en: Use this filter to search datasets by temporal coverage.
      nl: Gebruik deze filter om datasets op temporele dekking te zoeken.
    facet_key: temporal_coverage

  - field_name: temporal_resolution
    label: Temporal resolution
    help_text: Minimum time period resolvable in the dataset.
