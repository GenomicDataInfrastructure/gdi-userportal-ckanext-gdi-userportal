dataset_fields:
  - field_name: population_coverage
    label: Population coverage
    preset: fluent_markdown
    help_text: A definition of the population within the dataset.

  - field_name: retention_period
    label: Retention period
    repeating_subfields:
      - field_name: start
        label: Start
        preset: datetime_flex

      - field_name: end
        label: End
        preset: datetime_flex
    help_text: A temporal period which the dataset is available for secondary use.

  - field_name: hdab
    label: Health data access body
    repeating_label: Health data access body
    repeating_once: true
    repeating_subfields:
      - field_name: uri
        label: URI

      - field_name: name
        label: Name

      - field_name: name_translated
        label: Name (translations)
        help_text: Name of the health data access body in each language.

      - field_name: email
        label: Email
        display_snippet: email.html

      - field_name: url
        label: URL
        display_snippet: link.html

      - field_name: type
        label: Type

      - field_name: identifier
        label: Identifier
        help_text: Unique identifier for the HDAB, such as a ROR ID.

      - field_name: country
        label: Country
        help_text: Country of the HDAB, per the EU Publications Office country authority table.
    help_text: Health Data Access Body supporting access to data in the Member State.

  - field_name: qualified_relation
    label: Qualified relation
    repeating_label: Relationship
    repeating_subfields:
      - field_name: uri
        label: URI

      - field_name: relation
        label: Relation
        help_text: The resource related to the source resource.

      - field_name: role
        label: Role
        help_text: The function of an entity or agent with respect to another entity or resource.
    help_text: A description of a relationship with another resource.

  - field_name: was_generated_by
    label: Was generated by
    repeating_label: Was generated by
    repeating_once: true
    repeating_subfields:
      - field_name: uri
        label: Activity URI
        help_text: URI of the activity that generated this resource (prov:wasGeneratedBy) (if available).

      - field_name: label
        label: Label
        help_text: Human-readable label for the activity.

      - field_name: type
        label: Activity type
        help_text: Type of the activity.

      - field_name: seeAlso
        label: See also
        help_text: Related link for the activity.

      - field_name: dct_type
        label: Type
        help_text: Type of the activity (URI).

      - field_name: startedAtTime
        label: Started at time
        preset: datetime_flex
        help_text: When the activity started (ISO 8601).

      - field_name: wasAssociatedWith
        label: Associated agent
        repeating_label: Agent
        repeating_once: true
        repeating_subfields:
          - field_name: uri
            label: URI

          - field_name: name
            label: Name

          - field_name: email
            label: Email
            display_snippet: email.html

          - field_name: url
            label: URL
            display_snippet: link.html

          - field_name: homepage
            label: Homepage
            display_snippet: link.html

          - field_name: type
            label: Type

          - field_name: identifier
            label: Identifier

          - field_name: actedOnBehalfOf
            label: Acted on behalf of
            repeating_label: Organization
            repeating_once: true
            repeating_subfields:
              - field_name: uri
                label: URI

              - field_name: name
                label: Name

              - field_name: email
                label: Email
                display_snippet: email.html

              - field_name: url
                label: URL
                display_snippet: link.html

              - field_name: type
                label: Type

              - field_name: identifier
                label: Identifier
    help_text: Structured wasGeneratedBy activity information, including agents and organizations.

  - field_name: qualified_attribution
    label: Qualified attribution
    repeating_label: Attribution
    repeating_subfields:
      - field_name: agent
        label: Agent
        repeating_label: Agent
        repeating_once: true
        repeating_subfields: !snippet agent_subfields

      - field_name: role
        label: Role
        help_text: Role of the agent (e.g., data processor, contributor).
    help_text: Structured qualified attribution information including agent and role.

  - field_name: quality_annotation
    label: Quality annotations
    repeating_label: Quality annotation
    repeating_subfields:
      - field_name: body
        label: Body
        help_text: Content of the quality annotation (e.g., URL to certificate, measurement value, assessment result).

      - field_name: target
        label: Target
        help_text: Aspect of the dataset being annotated (e.g., URI or description of what is being assessed).

      - field_name: motivated_by
        label: Motivated by
        help_text: Motivation or reason for the quality annotation.
    help_text: Quality annotations following DQV and Web Annotation standards.

  # Note: if not provided, this will be autogenerated
  - field_name: uri
    label: URI
    help_text: An URI for this dataset (if not provided it will be autogenerated).

resource_fields:
  - field_name: access_services
    label: Access services
    repeating_label: Access service
    repeating_subfields:
      - field_name: uri
        label: URI

      - field_name: title
        label: Title
        help_text: A title for the data service.

      - field_name: description
        label: Description
        form_snippet: markdown.html
        help_text: A free-text account of the data service.

      - field_name: theme
        label: Theme
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text
        help_text: A theme of the access service. An access service may be associated with multiple themes.

      - field_name: endpoint_description
        label: Endpoint description

      - field_name: endpoint_url
        label: Endpoint URL
        preset: multiple_text

      - field_name: serves_dataset
        label: Serves dataset
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

      - field_name: access_rights
        label: Access rights
        validators: ignore_missing unicode_safe
        help_text: Information regarding access or restrictions based on privacy, security, or other policies.

      - field_name: conforms_to
        label: Conforms to
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

      - field_name: format
        label: Format
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

      - field_name: identifier
        label: Identifier

      - field_name: alternate_identifier
        label: Other identifier
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text
        help_text: A secondary identifier of the data service, distinct from its primary identifier above.

      - field_name: language
        label: Language
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

      - field_name: rights
        label: Rights
        form_snippet: markdown.html
        help_text: Rights statement for the data service.

      - field_name: landing_page
        label: Landing page
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

      - field_name: keyword
        label: Keywords
        preset: tag_string_autocomplete
        form_placeholder: eg. economy, mental health, government
        help_text: Keywords or tags describing the data service. Use commas to separate multiple values.

      - field_name: keyword_translated
        label: Keywords (translations)
        help_text: Keywords describing the data service in each language.

      - field_name: applicable_legislation
        label: Applicable legislation
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text
        help_text: The legislation that mandates the creation or management of the data service.

      - field_name: contact
        label: Contact point
        repeating_label: Contact point
        repeating_once: true
        repeating_subfields:
          - field_name: uri
            label: URI

          - field_name: name
            label: Name

          - field_name: name_translated
            label: Name (translations)
            help_text: Name of the contact point in each language.

          - field_name: email
            label: Email
            display_snippet: email.html

          - field_name: identifier
            label: Identifier
            help_text: Unique identifier for the contact point, such as a ROR ID.

          - field_name: url
            label: URL
            preset: multiple_text
            validators: ignore_missing scheming_multiple_text
            display_snippet: link.html
        help_text: Contact information for enquiries about the data service.

      - field_name: creator
        label: Creator
        repeating_label: Creator
        repeating_subfields: !snippet agent_subfields

      - field_name: publisher
        label: Publisher
        repeating_label: Publisher
        repeating_once: true
        repeating_subfields: !snippet agent_subfields
        help_text: Entity responsible for making the data service available.

      - field_name: license
        label: License
        help_text: License in which the data service is made available.

      - field_name: modified
        label: Modification date
        preset: datetime_flex
        help_text: Most recent date on which the data service was changed, updated or modified.

      - field_name: hvd_category
        label: HVD Category
        help_text: A data category defined in the High Value Dataset Implementing Regulation.
        preset: multiple_text
        validators: ignore_missing scheming_multiple_text

    help_text: A data service that gives access to the resource.

  # Note: if not provided, this will be autogenerated
  - field_name: uri
    label: URI
    help_text: An URI for this resource (if not provided it will be autogenerated).
