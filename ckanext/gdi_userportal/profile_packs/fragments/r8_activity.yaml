# The activity that generated a dataset (prov:wasGeneratedBy). R8 lists the property and the health
# activity type; the see-also link, the start time and the associated agent only gdi_current has.

dataset_fields:
  - field_name: was_generated_by
    label: Was generated by
    repeating_label: Was generated by
    repeating_once: true
    repeating_subfields:
      - field_name: uri
        label: Activity URI
        help_text: URI of the activity that generated this resource (prov:wasGeneratedBy) (if available).

      - field_name: label
        label: Label
        help_text: Human-readable label for the activity.

      - field_name: type
        translate: true
        label: Activity type
        help_text: Type of the activity.

      - field_name: dct_type
        translate: {label_in: label}
        label: Type
        help_text: Type of the activity (URI).
    help_text: The activity that generated the dataset (prov:wasGeneratedBy).
