dataset_fields:
  - field_name: owner_org
    label: Organization
    preset: dataset_organization
    help_text: The CKAN organization the dataset belongs to.

  - field_name: url
    label: Landing page
    form_placeholder: http://example.com/dataset.json
    display_snippet: link.html
    help_text: Web page that can be navigated to gain access to the dataset, its distributions and/or additional information.

  # Note: this will fall back to metadata_created if not present
  - field_name: issued
    label: Release date
    preset: datetime_flex
    solr: {type: date}   # a Solr date: sorted and filtered as one (a partial date such as 2020 would not index)
    help_text: Date of publication of the dataset.
    filter_help_text:
      en: Use this filter to search datasets by release date.
      nl: Gebruik deze filter om datasets op releasedatum te zoeken.
    facet_key: issued

  # Note: this will fall back to metadata_modified if not present
  - field_name: modified
    label: Modification date
    preset: datetime_flex
    solr: {type: date}   # a Solr date: sorted and filtered as one (a partial date such as 2020 would not index)
    help_text: Most recent date on which the dataset was changed, updated or modified.
    filter_help_text:
      en: Use this filter to search datasets by modification date.
      nl: Gebruik deze filter om datasets op wijzigingsdatum te zoeken.
    facet_key: modified

  - field_name: in_series
    preset: dataset_series_in_series
    # A dataset that is in no series stores nothing: scheming_multiple_choice would store the empty list "[]".
    validators: ignore_empty scheming_multiple_choice series_validator
    # ckanext-dataset-series runs after this plugin while indexing and reads in_series as the JSON text it is stored as.
    solr: {decode: false, text: false}
    help_text: Dataset series this dataset belongs to.

  - field_name: version
    label: Version
    validators: ignore_missing unicode_safe package_version_validator
    help_text: Version number or other version designation of the dataset.

  - field_name: version_notes
    label: Version notes
    preset: fluent_markdown
    help_text: A description of the differences between this version and a previous version of the dataset.
