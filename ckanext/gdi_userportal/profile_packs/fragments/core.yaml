scheming_version: 2
dataset_type: dataset
about: HealthDCAT-AP schema extended with GDI-specific fields
about_url: https://github.com/GenomicDataInfrastructure/gdi-userportal-ckan-docker

form_languages: [en, nl]

dataset_fields:
  - field_name: title_translated
    label: Title
    preset: fluent_core_translated
    help_text:
      en: A descriptive title for the dataset.
      nl: Een beschrijvende titel voor de dataset.
    filter_help_text:
      en: Use this filter to search datasets by title.
      nl: Gebruik deze filter om datasets op titel te zoeken.
    facet_key: title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes_translated
    label: Description
    preset: fluent_core_translated
    form_snippet: fluent_markdown.html
    display_snippet: fluent_markdown.html
    help_text: A free-text account of the dataset.

  - field_name: tags_translated
    label: Keywords
    preset: fluent_tags
    form_placeholder: eg. economy, mental health, government
    help_text: Keywords or tags describing the dataset. Use commas to separate multiple values.
    filter_help_text:
      en: Use this filter to search datasets by keywords.
      nl: Gebruik deze filter om datasets op trefwoorden te zoeken.
    facet_key: tags

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name_translated
    label: Name
    preset: fluent_core_translated
    help_text: A descriptive title for the resource. 

  - field_name: description_translated
    label: Description
    preset: fluent_core_translated
    form_snippet: fluent_markdown.html
    display_snippet: fluent_markdown.html
    help_text: A free-text account of the resource.
