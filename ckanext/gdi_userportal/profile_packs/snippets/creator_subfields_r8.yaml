# The creator of a dataset in R8: an agent with a name, a type and how to reach it. It has no
# description and no contact point, and none of the legacy HealthDCAT-AP publisher fields.

- field_name: uri
  label: URI

- field_name: name
  label: Name

- field_name: name_translated
  label: Name (translations)
  help_text: Name of the entity or person in each language.

- field_name: email
  label: Email
  display_snippet: email.html

- field_name: url
  label: URL
  display_snippet: link.html

- field_name: type
  label: Type

- field_name: identifier
  label: Identifier
  help_text: Unique identifier for the agent, such as a ROR or ORCID ID.

- field_name: country
  label: Country
  help_text: Country of the agent, per the EU Publications Office country authority table.
