# hdab_subfields.yaml plus what R8 adds to the contact point of a HDAB, with the name as one or
# more names, one per language, and the properties of the contact point together.
# test_healthdcat_r8_pack.py checks that nothing else differs.

- field_name: uri
  label: URI

- field_name: name
  label: Name
  help_text: The name of the health data access body. Give it in other languages in the field below.

- field_name: name_translated
  label: Name in each language
  preset: fluent_text
  display_snippet: all_languages.html
  display_label: Name
  display_replaces: name
  help_text: The name of the health data access body in each language; R8 allows one or more names.

- field_name: type
  label: Type

# The properties of the contact point (cv:ContactPoint) of the agent. display_group shows them
# together, under the contact point, on the dataset page.
- field_name: email
  label: Email
  display_group: Contact point
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: Emails of the contact point of the agent (cv:email), at least one email or contact page.

- field_name: url
  label: Contact page
  display_group: Contact point
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: Contact pages of the contact point of the agent (cv:contactPage), at least one email or contact page.

- field_name: telephone
  label: Telephone
  display_group: Contact point
  preset: multiple_text
  validators: ignore_missing scheming_multiple_text
  help_text: Telephone numbers of the contact point (cv:telephone).

- field_name: opening_hours
  label: Opening hours
  repeating_label: Opening hours
  display_group: Contact point
  help_text: When the contact point can be reached (cv:openingHours).
  repeating_subfields:
    - field_name: description_translated
      label: Description
      help_text: Description of the opening hours in each language.

    - field_name: frequency
      label: Frequency
      help_text: How often the contact point is open, per the EU Publications Office frequency authority table.

- field_name: special_opening_hours
  label: Special opening hours
  repeating_label: Special opening hours
  display_group: Contact point
  help_text: Exceptions to the opening hours (cv:specialOpeningHoursSpecification).
  repeating_subfields:
    - field_name: description_translated
      label: Description
      help_text: Description of the exception in each language.

    - field_name: frequency
      label: Frequency
      help_text: How often the exception applies, per the EU Publications Office frequency authority table.
