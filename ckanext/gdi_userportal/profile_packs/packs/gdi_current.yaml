# The portal's original metadata model. Its schema is the fragments below, which
# together hold the same fields as scheming/schemas/dataset_multilingual.yaml; the generator
# orders them by label, the title and the description first (field_order).
name: gdi_current
fragments:
  - core
  - dcat_ap_a
  - dcat_ap_publisher
  - dcat_ap_creator
  - gdi_license
  - dcat_ap_a2
  - gdi_dataset_status
  - dcat_ap_b
  - gdi_spatial
  - dcat_ap_b3
  - gdi_resource_checksum
  - dcat_ap_b3_distribution
  - gdi_resource_retention
  - dcat_ap_b2
  - health_base_a
  - gdi_publisher_legacy
  - gdi_trusted_data_holder
  - health_base_b
  - health_hdab
  - health_access_services
  - health_base_c
  - gdi_activity
  - gdi_attribution
  - health_base_c2
rdf_profiles:
  - fairdatapoint_dcat_ap
  - euro_dcat_ap_nl
redefines: []
field_order: alphabetical  # by label, the title and the description first
series_schema: ckanext.gdi_userportal:scheming/schemas/dataset_series_multilingual.yaml
