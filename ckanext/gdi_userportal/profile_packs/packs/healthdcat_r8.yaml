# HealthDCAT-AP Release 8. It holds the properties of the R8 model and nothing else: what only
# gdi_current has (dataset_status, trusted_data_holder, the dataset license, the retention period of
# a distribution, the legacy publisher type and note, the identifier and country of an agent, ...)
# is left out, and lives in fragments of the gdi_current pack.
#
# The shared fields R8 defines differently are listed under redefines below; the README describes
# them. With both packs enabled the pack listed first decides: list healthdcat_r8 first to get the
# R8 versions.
#
# conformance holds the properties R8 makes mandatory per access layer, generated from R8's
# cardinality rules by conformance_build.py. related_resource and source are kept when this
# pack is retired: the shared RDF mapping reads and writes them as free extras in every profile.
name: healthdcat_r8
fragments:
  - core
  - r8_contact
  - r8_publisher
  - r8_creator
  - dcat_ap_a2
  - dcat_ap_b
  - r8_spatial
  - dcat_ap_b3
  - r8_distribution_policy
  - dcat_ap_b2
  - health_base_a
  - health_base_b
  - r8_hdab
  - r8_access_services
  - r8_qualified_relation
  - r8_activity
  - r8_attribution
  - health_base_c2
  - r8_additions
rdf_profiles:
  - euro_health_dcat_ap_r8
redefines:
  - dataset_fields.contact
  - dataset_fields.spatial_coverage
  - dataset_fields.publisher
  - dataset_fields.creator
  - dataset_fields.qualified_attribution
  - dataset_fields.was_generated_by
  - dataset_fields.hdab
  - dataset_fields.qualified_relation
  - dataset_fields.spatial_resolution_in_meters
  - dataset_fields.retention_period
  - resource_fields.spatial_resolution_in_meters
  - resource_fields.access_services
overrides:
  # R8 calls the property "spatial resolution" (its IRI is dcat:spatialResolutionInMeters), and a
  # dataset has at most one retention period.
  dataset_fields.spatial_resolution_in_meters:
    label: Spatial resolution
  resource_fields.spatial_resolution_in_meters:
    label: Spatial resolution
  dataset_fields.retention_period:
    repeating_once: true
    repeating_label: Retention period
conformance: conformance/healthdcat_r8.json
series_schema: ckanext.gdi_userportal:scheming/schemas/dataset_series_r8.yaml
keep_extras:
  - related_resource
  - source
