# HealthDCAT-AP Release 8. It shares the neutral fields of gdi_current and adds the R8
# fields in r8_additions. Fields only gdi_current defines (dataset_status,
# trusted_data_holder) are left out: R8 has no such property.
#
# publisher, hdab and access_services are the shared fields R8 adds subfields to (opening
# hours on the contact point of an agent, documentation on a data service). They are
# redefined, so with both packs enabled the pack listed first decides: list healthdcat_r8
# first to get the subfields.
#
# conformance holds the properties R8 makes mandatory per access layer, generated from R8's
# cardinality rules by conformance_build.py. related_resource and source are kept when this
# pack is retired: the shared RDF mapping reads and writes them as free extras in every profile.
name: healthdcat_r8
fragments:
  - core
  - dcat_ap_a
  - r8_publisher
  - dcat_ap_a2
  - dcat_ap_b
  - health_base_a
  - health_base_b
  - r8_hdab
  - r8_access_services
  - health_base_c
  - r8_additions
rdf_profiles:
  - euro_health_dcat_ap_r8
redefines:
  - dataset_fields.publisher
  - dataset_fields.hdab
  - resource_fields.access_services
conformance: conformance/healthdcat_r8.json
keep_extras:
  - related_resource
  - source
